services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: marsad
      POSTGRES_PASSWORD: marsad
      POSTGRES_DB: marsad
    ports: ["5432:5432"]
  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["8080:8080"]
    depends_on: [postgres]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]